[project]
name = "snstfqkd"
version = "2.0.0"
description = "Research-grade SNS-TF-QKD simulation package (analytical, Monte-Carlo, and protocol-level layers)"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24,<3.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas>=1.5",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["snstfqkd*"]
